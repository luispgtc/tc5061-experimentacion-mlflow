[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "adult_income"
version = "0.0.1"
description = "C\u00f3digo de experimentaci\u00f3n base con MLflow Tracking: regresi\u00f3n log\u00edstica sobre UCI Adult (TC5061, semana 4)."
authors = [
  { name = "Luis Pablo Guerrero Garza" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["adult_income"]
include = ["pyproject.toml", "adult_income/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["adult_income"]
force-sort-within-sections = true

